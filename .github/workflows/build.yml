name: Build Fox MR
on: [push, workflow_dispatch]
defaults:
  run:
    working-directory: FoxMRMobile
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: 8.7}
      - run: mkdir -p tracker/src/main/assets && curl -L -o tracker/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      - run: gradle :tracker:assembleRelease :app:assembleDebug --no-daemon
      - run: mkdir -p unity/FoxMR/Plugins/Android && cp tracker/build/outputs/aar/tracker-release.aar unity/FoxMR/Plugins/Android/foxmr-tracker.aar
      - uses: actions/upload-artifact@v4
        with: {name: FoxMR-app-apk, path: FoxMRMobile/app/build/outputs/apk/debug/app-debug.apk}
      - uses: actions/upload-artifact@v4
        with: {name: FoxMR-Unity-package, path: FoxMRMobile/unity/FoxMR}
